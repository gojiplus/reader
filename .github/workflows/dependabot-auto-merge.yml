name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 */3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  auto-merge:
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: gojiplus/py-canon/.github/workflows/reusable-dependabot-auto-merge.yml@v1
