version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Keep types on the Node major declared in .nvmrc.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      radix-ui:
        patterns:
          - '@radix-ui/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      nextjs:
        patterns:
          - next
          - eslint-config-next
          - eslint-plugin-react-hooks
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - eslint
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  # Workflow actions go stale silently; this is what would have caught the
  # Node 20 deprecation on checkout/setup-node before it became an annotation
  # on every run.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
